  id: 1015245973
  thumbnail: /images/Say-Wuff-Thumb-Website.jpg
  caption: "The 30 minute long romantic outsider lovestory is Podeszwa’s thesis-film at the ‘Academy of Media Arts Cologne’. It was funded by ‘Film- und Medienstiftung NRW’."
